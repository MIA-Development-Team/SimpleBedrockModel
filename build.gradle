plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
    id "com.modrinth.minotaur" version "2.8.7"
    id 'me.champeau.jmh' version '0.7.2'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base {
    archivesName = 'simplebedrockmodel'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }


        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }


        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.main.java {
    exclude 'example/**'
    exclude 'com/github/mcmodderanchor/simplebedrockmodel/v2/particle/debug/**'
}

configurations {
    sodiumMod
    runtimeClasspath.extendsFrom localRuntime

    // 自定义一个 minecraftLibrary，方便引入需要 jarJar 的库
    mcLib
    implementation {
        extendsFrom mcLib
    }
    additionalRuntimeClasspath {
        extendsFrom mcLib
    }

    // 让测试编译期能访问 Minecraft / NeoForge 等主模块的编译依赖
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

repositories {
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    mavenLocal()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
        content {
            includeGroup "curse.maven"
        }
    }
    mavenLocal()
    mavenCentral()
}

dependencies {
    sodiumMod "net.caffeinemc:sodium-neoforge:0.9.1+mc26.1.2"
    implementation "net.caffeinemc:sodium-neoforge:0.9.1+mc26.1.2"
    compileOnly files(layout.buildDirectory.dir('generated/sodiumApiClasses'))
    mcLib jarJar("com.maydaymemory:mae:1.1.4") {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    api 'org.ow2.asm:asm:9.8'

    // 测试用兼容模组：发布时仍保持可选依赖。

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation "org.joml:joml:1.10.5"

    // JMH: mocha 原版 (javassist) 用于性能对比
    jmhImplementation 'team.unnamed:mocha:3.0.1'
}

// 用于 neoforge.mods 里替换那一堆 ${xxxx}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// 生成 manifest 内容，用于填充版本信息等内容
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    exclude 'example/**'
    exclude 'assets/example/**'
    exclude 'data/example/**'
}

// 让 idea 主动下载前置库的源码和 Javadoc
// 新版本 idea 默认不会下载这两个，这虽然加快了构建速度，但是不方便调试
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 必须，编码需要显式指定为 UTF
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jmh {
    zip64 = true
    jmhVersion = '1.37'
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = mod_id
    versionName = "${mod_id}-${version}"
    versionNumber = mod_version
    uploadFile = "${layout.buildDirectory.get()}/libs/${mod_id}-${version}.jar"
    additionalFiles = ["${layout.buildDirectory.get()}/libs/${mod_id}-${version}-sources.jar"]
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    //debugMode = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version

            from components.java

            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
}

tasks.register("runWithRenderDoc", Exec) {
    commandLine = [
            "D:\\tools\\RenderDoc_1.44_64\\renderdoccmd.exe",
            "capture",
            "--opt-hook-children",
            "--wait-for-exit",
            "--working-dir",
            projectDir.absolutePath,

            "C:\\Windows\\System32\\cmd.exe",
            "/c",
            file("gradlew.bat").absolutePath,
            "--no-daemon",
            "runClient"
    ]

    doFirst {
        println "=== RenderDoc gradlew command ==="
        println commandLine.collect {
            it.toString().contains(" ") ? "\"${it}\"" : it
        }.join(" ")
        println "================================="
    }
}

tasks.register('extractSodiumApi', Copy) {
    from({ zipTree(configurations.sodiumMod.singleFile) }) {
        include 'META-INF/jarjar/*-mod.jar'
        rename { 'sodium-api.jar' }
    }
    into layout.buildDirectory.dir('generated/sodiumApi')
}

tasks.register('extractSodiumApiClasses', Copy) {
    dependsOn tasks.named('extractSodiumApi')
    from({ zipTree(layout.buildDirectory.file('generated/sodiumApi/META-INF/jarjar/sodium-api.jar').get().asFile) })
    into layout.buildDirectory.dir('generated/sodiumApiClasses')
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('extractSodiumApiClasses')
}
